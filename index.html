<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الإمبوستر أونلاين 🕵️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4">

    <header class="text-center my-4">
        <h1 class="text-4xl font-black text-rose-500 tracking-wider mb-1">🕵️ لعبة الإمبوستر أونلاين</h1>
        <p class="text-slate-400 text-sm">كل واحد يلعب من التيليفون ديالو!</p>
    </header>

    <main class="max-w-md mx-auto w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
        
        <!-- STEP 1: LOGIN & ROOM CHOICE -->
        <div id="login-step" class="space-y-4">
            <div>
                <label class="block text-xs text-slate-400 mb-1">سميتك:</label>
                <input type="text" id="player-name" placeholder="ادخل اسمك..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-rose-500">
            </div>

            <div class="pt-2 space-y-3">
                <button onclick="createRoom()" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3.5 rounded-xl transition">
                    إنشاء غرفة جديدة ➕
                </button>
                
                <div class="flex items-center gap-2 my-2">
                    <hr class="flex-1 border-slate-800"><span class="text-xs text-slate-500">أو</span><hr class="flex-1 border-slate-800">
                </div>

                <div class="flex gap-2">
                    <input type="text" id="room-code-input" placeholder="كود الغرفة..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white uppercase focus:outline-none focus:border-rose-500">
                    <button onclick="joinRoom()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-3 rounded-xl transition">
                        دخول
                    </button>
                </div>
            </div>
        </div>

        <!-- STEP 2: LOBBY -->
        <div id="lobby-step" class="hidden space-y-6 text-center">
            <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl">
                <p class="text-xs text-slate-400">كود الغرفة (بارطاجيه مع الدراري):</p>
                <p id="display-room-code" class="text-3xl font-black text-rose-500 tracking-widest mt-1"></p>
            </div>

            <div>
                <p class="text-xs text-slate-400 mb-2">اللاعبين داخل الغرفة:</p>
                <div id="lobby-players-list" class="flex flex-wrap gap-2 justify-center min-h-[60px] p-3 bg-slate-950 rounded-xl border border-slate-800"></div>
            </div>

            <button id="host-start-btn" onclick="hostStartGame()" class="hidden w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-xl text-lg transition">
                ابدأ اللعبة 🚀
            </button>
            <p id="waiting-msg" class="text-xs text-amber-400 italic">في انتظار صاحب الغرفة يبدأ اللعبة...</p>
        </div>

        <!-- STEP 3: GAMEPLAY (SECRET ROLE) -->
        <div id="game-step" class="hidden space-y-6 text-center">
            <div class="bg-slate-950 border border-slate-800 p-6 rounded-2xl space-y-3">
                <p class="text-xs text-slate-400">الفئة:</p>
                <p id="game-category" class="text-lg font-bold text-amber-400"></p>
                <hr class="border-slate-800">
                <p class="text-xs text-slate-400">دورك والكلمة السرية:</p>
                <div id="my-role-card" class="py-4 px-2 rounded-xl border border-slate-800"></div>
            </div>

            <div id="host-controls" class="hidden pt-4">
                <button onclick="resetGame()" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl transition">
                    إنهاء الجولة وبدء جولة جديدة 🔄
                </button>
            </div>
        </div>

    </main>

    <footer class="text-center text-xs text-slate-600 my-2">
        Imposter Game Online Edition • GitHub Pages Ready
    </footer>

    <script>
        // Demo Public Firebase DB
        const firebaseConfig = {
            databaseURL: "https://imposter-game-demo-default-rtdb.europe-west1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentRoom = null;
        let myName = "";
        let isHost = false;

        const wordsList = [
            { category: "أكلات مغربية 🇲🇦", word: "كُسْكُسْ" },
            { category: "أكلات مغربية 🇲🇦", word: "طَاجِينْ" },
            { category: "أكلات مغربية 🇲🇦", word: "بَسْطِيلَة" },
            { category: "أماكن 🌍", word: "حَمَّامْ شَعْبِي" },
            { category: "أماكن 🌍", word: "مَطَارْ" },
            { category: "أماكن 🌍", word: "مَلْعَبْ كُورَة" },
            { category: "تكنولوجيا 📱", word: "آيْفُونْ" },
            { category: "تكنولوجيا 📱", word: "تِلْفَازَة" },
            { category: "أشياء 📦", word: "صَبّاطْ" },
            { category: "أشياء 📦", word: "كُرْسِي" },
            { category: "حيوانات 🦁", word: "سَبُعْ" },
            { category: "حيوانات 🦁", word: "قَطَّة" }
        ];

        function createRoom() {
            myName = document.getElementById('player-name').value.trim();
            if (!myName) return alert("من فضلك اكتب اسمك الأول!");

            currentRoom = Math.random().toString(36).substring(2, 8).toUpperCase();
            isHost = true;

            const roomRef = db.ref('rooms/' + currentRoom);
            roomRef.set({
                host: myName,
                state: 'lobby',
                players: { [myName]: true }
            });

            listenToRoom();
        }

        function joinRoom() {
            myName = document.getElementById('player-name').value.trim();
            const code = document.getElementById('room-code-input').value.trim().toUpperCase();
            if (!myName || !code) return alert("كتب سميتك وكود الغرفة!");

            currentRoom = code;
            isHost = false;

            const roomRef = db.ref('rooms/' + currentRoom);
            roomRef.once('value', (snapshot) => {
                if (snapshot.exists()) {
                    db.ref(`rooms/${currentRoom}/players/${myName}`).set(true);
                    listenToRoom();
                } else {
                    alert("الغرفة غير موجودة!");
                }
            });
        }

        function listenToRoom() {
            document.getElementById('login-step').classList.add('hidden');
            document.getElementById('lobby-step').classList.remove('hidden');
            document.getElementById('display-room-code').innerText = currentRoom;

            if (isHost) {
                document.getElementById('host-start-btn').classList.remove('hidden');
                document.getElementById('waiting-msg').classList.add('hidden');
            }

            db.ref('rooms/' + currentRoom).on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                // Update Lobby Player List
                if (data.players) {
                    const playersArray = Object.keys(data.players);
                    document.getElementById('lobby-players-list').innerHTML = playersArray.map(p => `
                        <span class="bg-slate-800 border border-slate-700 text-sm text-slate-200 px-3 py-1.5 rounded-lg">
                            👤 ${p} ${p === data.host ? '👑' : ''}
                        </span>
                    `).join('');
                }

                // Check Game State
                if (data.state === 'playing') {
                    showGameScreen(data);
                } else if (data.state === 'lobby') {
                    document.getElementById('game-step').classList.add('hidden');
                    document.getElementById('lobby-step').classList.remove('hidden');
                }
            });
        }

        function hostStartGame() {
            db.ref('rooms/' + currentRoom + '/players').once('value', (snapshot) => {
                const players = Object.keys(snapshot.val());
                if (players.length < 2) return alert("خاص يكونوا على الأقل 2 لاعبين!");

                const imposter = players[Math.floor(Math.random() * players.length)];
                const secret = wordsList[Math.floor(Math.random() * wordsList.length)];

                db.ref('rooms/' + currentRoom).update({
                    state: 'playing',
                    imposter: imposter,
                    category: secret.category,
                    word: secret.word
                });
            });
        }

        function showGameScreen(data) {
            document.getElementById('lobby-step').classList.add('hidden');
            document.getElementById('game-step').classList.remove('hidden');

            document.getElementById('game-category').innerText = data.category;
            const card = document.getElementById('my-role-card');

            if (myName === data.imposter) {
                card.className = "py-4 px-2 rounded-xl bg-rose-950/40 border border-rose-600/50";
                card.innerHTML = `
                    <p class="text-2xl font-black text-rose-500 mb-1">🤫 أَنْتَ هُوَ الإِمْبُوسْتِرْ!</p>
                    <p class="text-xs text-slate-300">حاول تمثل وما تخلي حد يعيق بيك!</p>
                `;
            } else {
                card.className = "py-4 px-2 rounded-xl bg-emerald-950/40 border border-emerald-600/50";
                card.innerHTML = `
                    <p class="text-xs text-slate-400 mb-1">الكلمة السرية هي:</p>
                    <p class="text-3xl font-black text-emerald-400">${data.word}</p>
                `;
            }

            if (isHost) {
                document.getElementById('host-controls').classList.remove('hidden');
            }
        }

        function resetGame() {
            db.ref('rooms/' + currentRoom).update({
                state: 'lobby'
            });
        }
    </script>
</body>
</html>
